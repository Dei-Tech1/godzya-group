<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GODZYA GROUP | AI • DATA • BUSINESS • TECHNOLOGY
    </title>

    <meta
        name="description"
        content="GODZYA GROUP builds intelligent AI, data, business and technology solutions for ambitious businesses ready to grow."
    >

    <meta
        name="theme-color"
        content="#050b14"
    >

    <style>

        /* =====================================================
           GODZYA GROUP
           PREMIUM HOME PAGE
        ===================================================== */

        :root {

            --bg:
                #050b14;

            --bg-deep:
                #030810;

            --bg-soft:
                #081321;

            --panel:
                rgba(10, 23, 40, .78);

            --panel-strong:
                rgba(8, 19, 33, .94);

            --text:
                #f4f8fc;

            --muted:
                #aab8c8;

            --soft:
                #7f91a5;

            --cyan:
                #46d9ff;

            --blue:
                #3b82f6;

            --line:
                rgba(255,255,255,.10);

            --line-soft:
                rgba(255,255,255,.06);

            --max:
                1180px;

            --radius:
                24px;

            --shadow:
                0 30px 90px rgba(0,0,0,.38);

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color:
                var(--text);

            background:
                var(--bg);

            overflow-x:
                hidden;

            line-height:
                1.6;

        }


        img {
            max-width: 100%;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button,
        a {
            -webkit-tap-highlight-color:
                transparent;
        }


        ::selection {

            background:
                rgba(70,217,255,.25);

            color:
                white;

        }


        /* =====================================================
           GLOBAL BACKGROUND
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -5;

            background:

                radial-gradient(
                    circle at 15% 10%,
                    rgba(22,78,99,.22),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 25%,
                    rgba(16,42,67,.28),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(59,130,246,.08),
                    transparent 35%
                );

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position:
                fixed;

            top:
                0;

            left:
                0;

            width:
                100%;

            z-index:
                1000;

            border-bottom:
                1px solid rgba(255,255,255,.06);

            background:
                rgba(5,11,20,.72);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

        }


        .header-inner {

            width:
                min(
                    var(--max),
                    calc(100% - 40px)
                );

            height:
                78px;

            margin:
                auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

        }


        /* LOGO */

        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            font-size:
                18px;

            font-weight:
                900;

            letter-spacing:
                1.5px;

        }


        .brand-mark {

            width:
                34px;

            height:
                34px;

            display:
                grid;

            place-items:
                center;

            border:
                1px solid rgba(70,217,255,.35);

            border-radius:
                10px;

            color:
                var(--cyan);

            background:
                linear-gradient(
                    145deg,
                    rgba(70,217,255,.13),
                    rgba(59,130,246,.05)
                );

            box-shadow:
                0 0 25px rgba(70,217,255,.08);

        }


        .brand span {

            color:
                var(--cyan);

        }


        /* NAV */

        .nav-links {

            display:
                flex;

            align-items:
                center;

            gap:
                28px;

        }


        .nav-links a {

            position:
                relative;

            color:
                #c5d0dc;

            font-size:
                13px;

            font-weight:
                650;

            letter-spacing:
                .2px;

            transition:
                color .3s ease;

        }


        .nav-links a::after {

            content:
                "";

            position:
                absolute;

            left:
                0;

            bottom:
                -8px;

            width:
                0;

            height:
                1px;

            background:
                var(--cyan);

            transition:
                width .3s ease;

        }


        .nav-links a:hover {

            color:
                white;

        }


        .nav-links a:hover::after {

            width:
                100%;

        }


        /* MENU */

        .menu-button {

            display:
                none;

            width:
                44px;

            height:
                44px;

            border:
                1px solid var(--line);

            border-radius:
                12px;

            background:
                rgba(255,255,255,.04);

            color:
                white;

            cursor:
                pointer;

            font-size:
                20px;

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position:
                relative;

            min-height:
                100vh;

            padding:
                145px 20px 90px;

            display:
                flex;

            align-items:
                center;

            overflow:
                hidden;

            background:

                radial-gradient(
                    circle at 18% 40%,
                    rgba(22,78,99,.55),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 82% 30%,
                    rgba(16,42,67,.68),
                    transparent 38%
                ),

                #07111f;

        }


        .hero::before {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:
                linear-gradient(
                    90deg,
                    rgba(5,11,20,.90),
                    rgba(5,11,20,.62),
                    rgba(5,11,20,.90)
                );

            z-index:
                0;

        }


        .hero-grid {

            position:
                absolute;

            inset:
                0;

            opacity:
                .16;

            background-image:

                linear-gradient(
                    rgba(70,217,255,.10) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(70,217,255,.10) 1px,
                    transparent 1px
                );

            background-size:
                80px 80px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 25%,
                    black 70%,
                    transparent
                );

        }


        .hero-inner {

            position:
                relative;

            z-index:
                2;

            width:
                min(
                    var(--max),
                    100%
                );

            margin:
                auto;

            display:
                grid;

            grid-template-columns:
                1.05fr .95fr;

            gap:
                60px;

            align-items:
                center;

        }


        .hero-content {

            max-width:
                680px;

        }


        .eyebrow {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                10px;

            margin-bottom:
                22px;

            color:
                var(--cyan);

            font-size:
                11px;

            font-weight:
                850;

            letter-spacing:
                3.5px;

            text-transform:
                uppercase;

        }


        .eyebrow::before {

            content:
                "";

            width:
                30px;

            height:
                1px;

            background:
                var(--cyan);

            box-shadow:
                0 0 12px rgba(70,217,255,.6);

        }


        .hero h1 {

            margin-bottom:
                16px;

            font-size:
                clamp(
                    54px,
                    8vw,
                    94px
                );

            line-height:
                .92;

            letter-spacing:
                -4px;

            font-weight:
                950;

        }


        .hero h1 span {

            display:
                block;

            color:
                transparent;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #8feaff,
                    #46d9ff
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

        }


        .slogan {

            margin-bottom:
                14px;

            color:
                #fff;

            font-size:
                clamp(
                    18px,
                    2.2vw,
                    24px
                );

            font-weight:
                750;

            letter-spacing:
                2px;

            text-transform:
                uppercase;

        }


        .hero-description {

            max-width:
                590px;

            margin-bottom:
                32px;

            color:
                var(--muted);

            font-size:
                16px;

            line-height:
                1.85;

        }


        /* HERO BUTTONS */

        .hero-actions {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                13px;

        }


        .btn {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                10px;

            min-height:
                50px;

            padding:
                0 22px;

            border:
                1px solid var(--line);

            border-radius:
                13px;

            font-size:
                13px;

            font-weight:
                800;

            transition:
                .35s ease;

        }


        .btn-primary {

            color:
                #04101a;

            background:
                linear-gradient(
                    135deg,
                    #76e8ff,
                    #46d9ff
                );

            border-color:
                transparent;

            box-shadow:
                0 12px 35px rgba(70,217,255,.18);

        }


        .btn-primary:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 18px 45px rgba(70,217,255,.28);

        }


        .btn-secondary {

            color:
                white;

            background:
                rgba(255,255,255,.035);

            backdrop-filter:
                blur(10px);

        }


        .btn-secondary:hover {

            border-color:
                rgba(70,217,255,.35);

            background:
                rgba(70,217,255,.07);

            transform:
                translateY(-3px);

        }


        /* =====================================================
           3D GODZYA LOGO CUBE
        ===================================================== */

        .hero-visual {

            position:
                relative;

            min-height:
                470px;

            display:
                grid;

            place-items:
                center;

        }


        .cube-glow {

            position:
                absolute;

            width:
                360px;

            height:
                360px;

            border-radius:
                50%;

            background:
                rgba(70,217,255,.13);

            filter:
                blur(80px);

            animation:
                glowPulse 5s ease-in-out infinite;

        }


        @keyframes glowPulse {

            0%,
            100% {
                transform:
                    scale(.92);
                opacity:
                    .55;
            }

            50% {
                transform:
                    scale(1.08);
                opacity:
                    .85;
            }

        }


        .cube-scene {

            position:
                relative;

            width:
                300px;

            height:
                300px;

            perspective:
                1100px;

        }


        .cube {

            position:
                absolute;

            inset:
                0;

            transform-style:
                preserve-3d;

            animation:
                cubeRotate 18s linear infinite;

        }


        @keyframes cubeRotate {

            0% {
                transform:
                    rotateX(-8deg)
                    rotateY(0deg);
            }

            100% {
                transform:
                    rotateX(-8deg)
                    rotateY(360deg);
            }

        }


        .cube-face {

            position:
                absolute;

            width:
                300px;

            height:
                300px;

            display:
                grid;

            place-items:
                center;

            overflow:
                hidden;

            border:
                1px solid rgba(70,217,255,.35);

            background:

                radial-gradient(
                    circle at 50% 40%,
                    rgba(70,217,255,.13),
                    transparent 55%
                ),

                linear-gradient(
                    145deg,
                    rgba(13,34,54,.97),
                    rgba(3,9,17,.98)
                );

            box-shadow:
                inset 0 0 45px rgba(70,217,255,.06),
                0 0 30px rgba(70,217,255,.05);

            backface-visibility:
                hidden;

        }


        .cube-face::before {

            content:
                "";

            position:
                absolute;

            inset:
                12px;

            border:
                1px solid rgba(255,255,255,.055);

            border-radius:
                14px;

        }


        .cube-face img {

            position:
                relative;

            z-index:
                2;

            width:
                72%;

            height:
                72%;

            object-fit:
                contain;

            filter:
                drop-shadow(
                    0 0 22px rgba(70,217,255,.28)
                );

        }


        .cube-front {
            transform:
                rotateY(0deg)
                translateZ(150px);
        }


        .cube-back {
            transform:
                rotateY(180deg)
                translateZ(150px);
        }


        .cube-right {
            transform:
                rotateY(90deg)
                translateZ(150px);
        }


        .cube-left {
            transform:
                rotateY(-90deg)
                translateZ(150px);
        }


        .cube-top {
            transform:
                rotateX(90deg)
                translateZ(150px);
        }


        .cube-bottom {
            transform:
                rotateX(-90deg)
                translateZ(150px);
        }


        /* CUBE REFLECTION */

        .cube-reflection {

            position:
                absolute;

            width:
                230px;

            height:
                55px;

            bottom:
                18px;

            left:
                50%;

            transform:
                translateX(-50%);

            border-radius:
                50%;

            background:
                rgba(70,217,255,.16);

            filter:
                blur(25px);

            opacity:
                .7;

        }


        /* =====================================================
           SECTION GLOBAL
        ===================================================== */

        section {

            position:
                relative;

            padding:
                105px 20px;

            overflow:
                hidden;

        }


        .section-inner {

            width:
                min(
                    var(--max),
                    100%
                );

            margin:
                auto;

        }


        .section-heading {

            max-width:
                720px;

            margin:
                0 auto 50px;

            text-align:
                center;

        }


        .section-label {

            margin-bottom:
                12px;

            color:
                var(--cyan);

            font-size:
                10px;

            font-weight:
                900;

            letter-spacing:
                4px;

            text-transform:
                uppercase;

        }

            margin-bottom:
                15px;

            font-size:
                clamp(
                    32px,
                    5vw,
                    54px

<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="GODZYA GROUP — Our accomplishments, projects and work built across technology, data, business and professional services."
  >

  <meta
    name="theme-color"
    content="#050b14"
  >

  <title>
    GODZYA GROUP | Our Accomplishments
  </title>

  <!-- =================================================
       GOOGLE FONTS
  ================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- =================================================
       GODZYA MAIN STYLES
  ================================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

<!-- =====================================================
     GODZYA NAVIGATION
===================================================== -->

<header class="site-header">

  <nav class="site-nav">

    <a
      href="index.html"
      class="brand"
      aria-label="GODZYA GROUP Home"
    >

      <span class="brand-mark">
        G
      </span>

      <span class="brand-text">
        GODZYA GROUP
      </span>

    </a>


    <button
      class="nav-toggle"
      type="button"
      aria-label="Open navigation"
      aria-expanded="false"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <div class="nav-links">

      <a
        href="index.html"
        data-nav="home"
      >
        <span data-i18n="navHome">Home</span>
      </a>

      <a
        href="what-we-do.html"
        data-nav="what-we-do"
      >
        <span data-i18n="navWhatWeDo">What We Do</span>
      </a>

      <a
        href="accomplishments.html"
        data-nav="accomplishments"
        class="active"
      >
        <span data-i18n="navAccomplishments">
          Our Accomplishments
        </span>
      </a>


      <div class="language-selector">

        <button
          class="language-button"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
        >

          <span class="language-current">
            EN
          </span>

          <span class="language-arrow">
            ↓
          </span>

        </button>


        <div class="language-menu">

          <button data-lang="en">English</button>
          <button data-lang="zh">中文</button>
          <button data-lang="es">Español</button>
          <button data-lang="hi">हिन्दी</button>
          <button data-lang="fr">Français</button>
          <button data-lang="ar">العربية</button>
          <button data-lang="pt">Português</button>
          <button data-lang="bn">বাংলা</button>
          <button data-lang="ru">Русский</button>
          <button data-lang="de">Deutsch</button>
          <button data-lang="sw">Kiswahili</button>
          <button data-lang="af">Afrikaans</button>

        </div>

      </div>

    </div>

  </nav>

</header>

</body>

</html>

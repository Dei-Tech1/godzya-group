<style>

/* =========================================================
   GODZYA GROUP — PREMIUM CORPORATE WEBSITE
========================================================= */

:root {
    --bg: #050b14;
    --bg-soft: #081321;
    --panel: rgba(10, 23, 40, 0.78);
    --text: #f4f8fc;
    --muted: #aab8c8;
    --cyan: #46d9ff;
    --blue: #3b82f6;
    --line: rgba(255,255,255,.10);
    --max: 1180px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Inter, Arial, Helvetica, sans-serif;
    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(25,105,145,.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 35%,
            rgba(36,91,180,.18),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

img {
    max-width: 100%;
    display: block;
}


/* =========================================================
   GLOBAL
========================================================= */

.container {
    width: min(92%, var(--max));
    margin: auto;
}

section {
    position: relative;
    padding: 110px 0;
    overflow: hidden;
}

.section-label {
    color: var(--cyan);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 18px;
}

.section-title {
    font-size: clamp(36px, 5vw, 64px);
    line-height: 1.05;
    letter-spacing: -2px;
    max-width: 800px;
    margin-bottom: 25px;
}

.section-text {
    color: var(--muted);
    max-width: 700px;
    font-size: 17px;
}

.gradient-text {
    background:
        linear-gradient(
            90deg,
            #ffffff,
            var(--cyan),
            #8bbcff
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


/* =========================================================
   HEADER
========================================================= */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;

    background:
        rgba(4,10,18,.72);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.navbar {
    width: min(94%, 1250px);
    margin: auto;

    min-height: 78px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;

    font-size: 19px;
    font-weight: 900;
    letter-spacing: 2px;

    white-space: nowrap;
}


/* =========================================================
   3D FLOATING CUBE LOGO
========================================================= */

.logo-cube-wrap {
    position: relative;

    width: 72px;
    height: 82px;

    display: flex;
    align-items: flex-start;
    justify-content: center;

    perspective: 700px;

    animation:
        cubeFloat
        4s
        ease-in-out
        infinite;
}

.logo-cube {
    position: relative;

    width: 50px;
    height: 50px;

    transform-style: preserve-3d;

    animation:
        cubeRotate
        10s
        ease-in-out
        infinite;
}

.cube-face {
    position: absolute;

    width: 50px;
    height: 50px;

    overflow: hidden;

    border-radius: 9px;

    backface-visibility: hidden;

    border:
        1px solid
        rgba(100,210,255,.28);

    box-shadow:
        inset 0 0 18px
        rgba(100,210,255,.08);

    background:
        #07111f;
}

.cube-face img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* FRONT */

.cube-front {
    transform:
        translateZ(25px);
}


/* BACK */

.cube-back {
    transform:
        rotateY(180deg)
        translateZ(25px);
}


/* RIGHT */

.cube-right {
    transform:
        rotateY(90deg)
        translateZ(25px);
}


/* LEFT */

.cube-left {
    transform:
        rotateY(-90deg)
        translateZ(25px);
}


/* TOP */

.cube-top {
    transform:
        rotateX(90deg)
        translateZ(25px);

    background:
        linear-gradient(
            135deg,
            #1a5168,
            #07111f
        );
}


/* BOTTOM */

.cube-bottom {
    transform:
        rotateX(-90deg)
        translateZ(25px);

    background:
        #030810;
}


/* =========================================================
   CUBE ROTATION
========================================================= */

@keyframes cubeRotate {

    0% {
        transform:
            rotateX(-8deg)
            rotateY(0deg)
            rotateZ(2deg);
    }

    20% {
        transform:
            rotateX(12deg)
            rotateY(65deg)
            rotateZ(-3deg);
    }

    40% {
        transform:
            rotateX(-5deg)
            rotateY(145deg)
            rotateZ(3deg);
    }

    60% {
        transform:
            rotateX(10deg)
            rotateY(225deg)
            rotateZ(-2deg);
    }

    80% {
        transform:
            rotateX(-8deg)
            rotateY(305deg)
            rotateZ(3deg);
    }

    100% {
        transform:
            rotateX(-8deg)
            rotateY(360deg)
            rotateZ(2deg);
    }
}


/* =========================================================
   FLOATING MOVEMENT
========================================================= */

@keyframes cubeFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-7px);
    }
}


/* =========================================================
   CUBE SHADOW
========================================================= */

.cube-shadow {
    position: absolute;

    left: 50%;
    bottom: 1px;

    width: 42px;
    height: 8px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:
        rgba(0,0,0,.55);

    filter:
        blur(6px);

    opacity: .65;

    animation:
        shadowFloat
        4s
        ease-in-out
        infinite;
}

@keyframes shadowFloat {

    0%,
    100% {
        transform:
            translateX(-50%)
            scaleX(1);

        opacity: .65;
    }

    50% {
        transform:
            translateX(-50%)
            scaleX(.70);

        opacity: .38;
    }
}


/* =========================================================
   CUBE HOVER
========================================================= */

.logo-cube-wrap:hover .logo-cube {
    animation-duration: 5s;
}

.logo-cube-wrap:hover {
    filter:
        drop-shadow(
            0 0 12px
            rgba(70,217,255,.28)
        );
}


/* =========================================================
   NAVIGATION
========================================================= */

    display: flex;

}

.nav-links a {

.nav-links a:hover {

}

.nav-cta {

/* =========================================================
